<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Inventory</title>
    <!-- Firebase libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.0/JsBarcode.all.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Book Inventory</h1>
        <button onclick="openAddBookModal()">Add Book</button>
    </header>
    <main>
        <ul id="book-list"></ul>
    </main>

    <div id="add-book-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeAddBookModal()">&times;</span>
            <h2>Add Book</h2>
            <input type="text" id="isbn" placeholder="ISBN" />
            <input type="text" id="title" placeholder="Title" />
            <input type="text" id="author" placeholder="Author" />
            <button onclick="addBook()">Add</button>
        </div>
    </div>

    <script>
         // ===== FIREBASE CONFIG =====
      const firebaseConfig = {
    apiKey: "AIzaSyBPry6ik9r7zuvKQDlg34XJP2EQ82NH_-U",
    authDomain: "abigyarn.firebaseapp.com",
    projectId: "abigyarn",
    storageBucket: "abigyarn.firebasestorage.app",
    messagingSenderId: "1051570958163",
    appId: "1:1051570958163:web:85337e2eff7ff747733ba6"
        };
        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function loadBooks() {
            // Fetch books from Firebase and populate the book list
            database.ref('books/').once('value').then((snapshot) => {
                const books = snapshot.val();
                const bookList = document.getElementById('book-list');
                bookList.innerHTML = '';
                for (const id in books) {
                    const book = books[id];
                    const listItem = document.createElement('li');
                    listItem.textContent = book.title + ' by ' + book.author;
                    listItem.innerHTML += `<button onclick="deleteBook('${id}')">Delete</button>`;
                    bookList.appendChild(listItem);
                }
            });
        }

        function deleteBook(id) {
            // Delete book from Firebase
            database.ref('books/' + id).remove();
            loadBooks();
        }

        function switchScanMode(mode) {
            // Switch between camera and manual modes
            // Implement your logic to toggle scanning modes
        }

        function startScanner() {
            // Start the camera scanner
            // Implement your camera using libraries like QuaggaJS or similar
        }

        function stopScanner() {
            // Stop the camera scanner
        }

        function openAddBookModal() {
            document.getElementById('add-book-modal').style.display = 'block';
        }

        function closeAddBookModal() {
            document.getElementById('add-book-modal').style.display = 'none';
        }

        function searchByISBN() {
            // Implement search by ISBN
            // Fetch from Firebase or local storage
        }

        function manualSearch() {
            // Implement manual search
        }

        function addBook() {
            const isbn = document.getElementById('isbn').value;
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            database.ref('books/').push({ isbn, title, author });
            closeAddBookModal();
            loadBooks();
        }

        // Load books on initial load
        loadBooks();
    </script>
</body>
</html>
