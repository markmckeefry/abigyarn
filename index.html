<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A BiG YaRN - Library Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'book-mauve': '#A17D83',
                        'book-mauve-light': '#B69096',
                        'book-cream': '#FAF6F1',
                    },
                    fontFamily: {
                        'serif': ['Merriweather', 'serif'],
                        'sans': ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAF6F1; }
        h1, h2, h3 { font-family: 'Merriweather', serif; color: #A17D83; }
    </style>
</head>
<body class="p-6 md:p-12">

    <header class="flex flex-col md:flex-row md:items-center md:justify-between pb-10 border-b border-gray-200 mb-10">
        <div>
            <h1 class="text-5xl font-bold">
                a <span class="text-4xl">BiG</span> <span class="text-4xl">YaRN</span>
            </h1>
            <p class="text-gray-600 mt-2">A minimal library tracker</p>
        </div>
        <div class="mt-6 md:mt-0 flex gap-4">
            <button onclick="openAddBookModal()" class="bg-book-mauve text-white px-6 py-3 rounded-lg font-semibold shadow-md hover:bg-book-mauve-light transition flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add New Book
            </button>
        </div>
    </header>

    <section class="mb-12">
        <div class="flex border-b border-gray-200 gap-6">
            <button class="pb-3 border-b-2 border-book-mauve text-book-mauve font-semibold text-lg">My Library</button>
        </div>
    </section>

    <main>
        <div id="bookGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <div class="text-center col-span-full py-12">
                <p class="text-gray-500">Loading your books...</p>
            </div>
        </div>
    </main>

    <div id="addBookModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-6 z-50">
        <div class="bg-white p-8 rounded-2xl w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto">
            <h2 class="text-2xl font-bold mb-4">Add a New Book</h2>
            
            <div class="flex gap-2 mb-4 border-b">
                <button onclick="switchScanMode('camera')" id="cameraTab" class="pb-2 px-4 border-b-2 border-book-mauve text-book-mauve font-semibold">📷 Camera</button>
                <button onclick="switchScanMode('manual')" id="manualTab" class="pb-2 px-4 border-b-2 border-transparent text-gray-500">✏️ Manual</button>
            </div>

            <div id="cameraMode" class="mb-4">
                <div id="reader" style="width: 100%; height: 300px; border: 2px solid #ccc; border-radius: 8px; margin-bottom: 12px;"></div>
                <input type="text" id="barcodeInput" placeholder="Or paste ISBN here..." class="w-full border p-3 rounded-lg mb-2"/>
                <button onclick="manualSearch()" class="w-full bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Search ISBN</button>
            </div>

            <div id="manualMode" class="mb-4 hidden">
                <p class="text-sm text-gray-600 mb-3">Enter book details:</p>
                <input type="text" id="bookTitle" placeholder="Book Title" class="w-full border p-3 rounded-lg mb-3"/>
                <input type="text" id="bookAuthor" placeholder="Author" class="w-full border p-3 rounded-lg mb-3"/>
                <input type="text" id="bookIsbn" placeholder="ISBN (optional)" class="w-full border p-3 rounded-lg mb-3"/>
                <input type="text" id="bookCoverUrl" placeholder="Cover Image URL" class="w-full border p-3 rounded-lg mb-3"/>
            </div>

            <select id="bookStatus" class="w-full border p-3 rounded-lg mb-4">
                <option value="Unread">Unread</option>
                <option value="Reading">Reading</option>
                <option value="Finished">Finished</option>
            </select>
            <div class="flex justify-end gap-3">
                <button onclick="closeAddBookModal()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded">Cancel</button>
                <button onclick="addBook()" class="bg-book-mauve text-white px-4 py-2 rounded">Add Book</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBPry6ik9r7zuvKQDlg34XJP2EQ82NH_-U",
            authDomain: "abigyarn.firebaseapp.com",
            projectId: "abigyarn",
            storageBucket: "abigyarn.firebasestorage.app",
            messagingSenderId: "1051570958163",
            appId: "1:1051570958163:web:85337e2eff7ff747733ba6"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function loadBooks() {
            const bookGrid = document.getElementById('bookGrid');
            try {
                const snapshot = await db.collection('books').get();
                bookGrid.innerHTML = '';

                if (snapshot.empty) {
                    bookGrid.innerHTML = '<div class="text-center col-span-full py-12"><p class="text-gray-500">No books yet. Add one to get started!</p></div>';
                    return;
                }

                snapshot.forEach(doc => {
                    const book = doc.data();
                    const docId = doc.id;
                    const statusColor = book.status === 'Reading' ? 'bg-green-100 text-green-800' : 
                                       book.status === 'Finished' ? 'bg-book-mauve/10 text-book-mauve' : 
                                       'bg-gray-100 text-gray-800';

                    bookGrid.innerHTML += `
                        <div class="book-entry bg-white p-4 rounded-xl shadow hover:shadow-lg transition border border-gray-100 flex flex-col gap-3 relative group">
                            <img src="${book.coverUrl}" alt="${book.title}" class="rounded-lg w-full h-auto object-cover aspect-[2/3]" onerror="this.src='https://via.placeholder.com/150x225?text=No+Cover'"/>
                            <div class="text-center">
                                <h3 class="font-bold text-gray-900 leading-tight text-sm">${book.title}</h3>
                                <p class="text-xs text-gray-600">${book.author}</p>
                                <span class="inline-block mt-2 text-xs px-2 py-0.5 rounded-full ${statusColor}">${book.status}</span>
                            </div>
                            <button onclick="deleteBook('${docId}')" class="absolute top-2 right-2 bg-red-500 text-white p-2 rounded-full opacity-0 group-hover:opacity-100 transition hover:bg-red-600" title="Delete book">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error loading books:', error);
                bookGrid.innerHTML = '<div class="text-center col-span-full py-12"><p class="text-red-500">Error: ' + error.message + '</p></div>';
            }
        }

        async function deleteBook(docId) {
            if (confirm('Are you sure you want to delete this book?')) {
                try {
                    await db.collection('books').doc(docId).delete();
                    loadBooks();
                    alert('Book deleted successfully!');
                } catch (error) {
                    console.error('Error deleting book:', error);
                    alert('Error deleting book: ' + error.message);
                }
            }
        }

        let html5QrcodeScanner = null;

        function switchScanMode(mode) {
            const cameraMode = document.getElementById('cameraMode');
            const manualMode = document.getElementById('manualMode');
            const cameraTab = document.getElementById('cameraTab');
            const manualTab = document.getElementById('manualTab');

            if (mode === 'camera') {
                cameraMode.classList.remove('hidden');
                manualMode.classList.add('hidden');
                cameraTab.classList.add('border-book-mauve', 'text-book-mauve', 'font-semibold');
                cameraTab.classList.remove('border-transparent', 'text-gray-500');
                manualTab.classList.add('border-transparent', 'text-gray-500');
                manualTab.classList.remove('border-book-mauve', 'text-book-mauve', 'font-semibold');
                startScanner();
            } else {
                cameraMode.classList.add('hidden');
                manualMode.classList.remove('hidden');
                manualTab.classList.add('border-book-mauve', 'text-book-mauve', 'font-semibold');
                manualTab.classList.remove('border-transparent', 'text-gray-500');
                cameraTab.classList.add('border-transparent', 'text-gray-500');
                cameraTab.classList.remove('border-book-mauve', 'text-book-mauve', 'font-semibold');
                stopScanner();
            }
        }

        function startScanner() {
            if (html5QrcodeScanner) return;
            
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                async (decodedText) => {
                    console.log('Barcode found:', decodedText);
                    document.getElementById('barcodeInput').value = decodedText;
                    await searchByISBN();
                },
                (error) => {
                    console.log('Scanning...', error);
                }
            ).catch((error) => {
                console.error('Camera access denied:', error);
                alert('Camera access denied. Please use manual entry or check permissions.');
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner = null;
                }).catch((error) => {
                    console.error('Error stopping scanner:', error);
                });
            }
        }

        function manualSearch() {
            searchByISBN();
        }

        function openAddBookModal() {
            document.getElementById('addBookModal').classList.remove('hidden');
            document.getElementById('addBookModal').classList.add('flex');
            switchScanMode('camera');
        }

        function closeAddBookModal() {
            document.getElementById('addBookModal').classList.add('hidden');
            document.getElementById('addBookModal').classList.remove('flex');
            stopScanner();
            document.getElementById('bookTitle').value = '';
            document.getElementById('bookAuthor').value = '';
            document.getElementById('bookIsbn').value = '';
            document.getElementById('bookCoverUrl').value = '';
            document.getElementById('bookStatus').value = 'Unread';
            document.getElementById('barcodeInput').value = '';
        }

        async function searchByISBN() {
            const isbn = document.getElementById('barcodeInput').value.trim();
            
            if (!isbn) {
                alert('Please scan or enter an ISBN');
                return;
            }

            try {
                const response = await fetch(`https://openlibrary.org/isbn/${isbn}.json`);
                
                if (!response.ok) {
                    alert('Book not found. Please enter details manually.');
                    return;
                }

                const book = await response.json();
                document.getElementById('bookTitle').value = book.title || '';
                document.getElementById('bookAuthor').value = 
                    book.authors && book.authors[0] ? book.authors[0].name : '';
                document.getElementById('bookIsbn').value = isbn;
                
                if (book.covers && book.covers.length > 0) {
                    document.getElementById('bookCoverUrl').value = 
                        `https://covers.openlibrary.org/b/id/${book.covers[0]}-M.jpg`;
                }
                
                switchScanMode('manual');
                alert('Book found! Review details and save.');
                document.getElementById('barcodeInput').value = '';
            } catch (error) {
                console.error('Error looking up ISBN:', error);
                alert('Error looking up book. Please enter details manually.');
            }
        }

        async function addBook() {
            const title = document.getElementById('bookTitle').value.trim();
            const author = document.getElementById('bookAuthor').value.trim();
            const isbn = document.getElementById('bookIsbn').value.trim();
            const coverUrl = document.getElementById('bookCoverUrl').value.trim();
            const status = document.getElementById('bookStatus').value;

            if (!title || !author) {
                alert('Please enter a title and author');
                return;
            }

            try {
                await db.collection('books').add({
                    title,
                    author,
                    isbn: isbn || 'N/A',
                    coverUrl: coverUrl || 'https://via.placeholder.com/150x225?text=No+Cover',
                    status,
                    createdAt: new Date()
                });
                closeAddBookModal();
                loadBooks();
                alert('Book added successfully!');
            } catch (error) {
                console.error('Error adding book:', error);
                alert('Error adding book: ' + error.message);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadBooks();
        });
    </script>

</body>
</html>
